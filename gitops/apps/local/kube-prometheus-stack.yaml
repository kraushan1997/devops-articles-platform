# Cluster + application observability: Prometheus Operator, Prometheus,
# Alertmanager, Grafana, node-exporter, kube-state-metrics.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 91.5.0
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/gitops/values/common/kube-prometheus-stack.yaml
          - $values/gitops/values/local/kube-prometheus-stack.yaml
    - repoURL: https://github.com/kraushan1997/devops-articles-platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      # the operator CRDs exceed the client-side apply annotation size limit
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
