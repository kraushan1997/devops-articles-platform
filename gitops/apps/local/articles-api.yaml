apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: articles-api
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/kraushan1997/devops-articles-platform.git
    targetRevision: main
    path: charts/articles-api
    helm:
      releaseName: articles-api
      valueFiles:
        - ../../gitops/values/common/articles-api.yaml
        - ../../gitops/values/common/images.yaml
        - ../../gitops/values/local/articles-api.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: articles
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      # CRDs (ServiceMonitor/PrometheusRule) come from kube-prometheus-stack;
      # skip dry-run for them on the very first sync and let retries converge
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
