# k3s runs the control-plane components inside the k3s binary; there are no
# separate scheduler/controller-manager/etcd/kube-proxy endpoints to scrape, so
# disable those jobs (otherwise they raise permanent "target down" alerts).
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeEtcd: { enabled: false }
kubeProxy: { enabled: false }

prometheus:
  prometheusSpec:
    resources:
      requests: { cpu: 100m, memory: 512Mi }
alertmanager:
  alertmanagerSpec:
    replicas: 1
