# Local dev loop: API + a single-member Mongo replica set (so transactions/change
# streams behave as they do in the cluster). Kubernetes uses the Helm charts instead.
services:
  mongo:
    image: mongo:7.0
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    healthcheck:
      # initiate the replica set on first boot, then report healthy once PRIMARY
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"
      interval: 5s
      timeout: 5s
      retries: 20
    volumes: ["mongo-data:/data/db"]

  api:
    build: ./app
    image: ghcr.io/kraushan1997/articles-api:local
    environment:
      MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0
    ports: ["8080:8080"]
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
